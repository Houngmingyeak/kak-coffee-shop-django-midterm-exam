<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee Shop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2C1A0E;
            --coffee-medium: #6F4E37;
            --coffee-light: #C4A882;
            --coffee-cream: #FFF8F0;
            --coffee-accent: #D47C35;
        }

        body {
            background-color: var(--coffee-cream);
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background-color: var(--coffee-dark) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--coffee-light) !important;
            letter-spacing: 0.5px;
        }

        .navbar-brand i { color: var(--coffee-accent); }

        .nav-link { color: #d4b896 !important; }
        .nav-link:hover { color: var(--coffee-light) !important; }

        .btn-coffee {
            background-color: var(--coffee-medium);
            color: #fff;
            border: none;
        }

        .btn-coffee:hover {
            background-color: var(--coffee-dark);
            color: #fff;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(111,78,55,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(111,78,55,0.18);
        }

        .badge-category {
            background-color: var(--coffee-light);
            color: var(--coffee-dark);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .price-tag {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--coffee-accent);
        }

        .page-header {
            background: linear-gradient(135deg, var(--coffee-dark) 0%, var(--coffee-medium) 100%);
            color: #fff;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .form-card {
            background: #fff;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(111,78,55,0.12);
        }

        .availability-badge {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 12px;
        }

        footer {
            background-color: var(--coffee-dark);
            color: var(--coffee-light);
            padding: 1.5rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'coffee_list' %}">
            <i class="fas fa-mug-hot me-2"></i>Coffee Shop
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'coffee_list' %}">
                        <i class="fas fa-list me-1"></i>Menu
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add_coffee' %}">
                        <i class="fas fa-plus-circle me-1"></i>Add Coffee
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                <i class="fas fa-{% if message.tags == 'success' %}check-circle{% else %}exclamation-circle{% endif %} me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<footer>
    <div class="container text-center">
        <i class="fas fa-mug-hot me-2"></i>
        Coffee Shop Management System &mdash; Built with Django
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
